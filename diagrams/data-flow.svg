<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7ee787"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="url(#bg)"/>
  <text x="40" y="36" fill="#7ee787" font-size="18" font-weight="600">claude-mem-for-all — data flow per deposit</text>
  <text x="40" y="56" fill="#3d4453" font-size="12">file form vs inline form, one SQLite write, one idempotency decision</text>

  <!-- column 1: two entry paths -->
  <text x="120" y="100" fill="#8b949e" font-size="12" text-anchor="middle">ENTRY PATH A · file form</text>
  <g font-size="11" fill="#c9d1d9">
    <rect x="60" y="116" width="120" height="26" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="120" y="133" fill="#e6edf3" text-anchor="middle">checkpoint.md</text>
    <text x="120" y="156" fill="#8b949e" text-anchor="middle">multibrain 07-Sessions note</text>
    <text x="120" y="172" fill="#8b949e" text-anchor="middle">`---` YAML frontmatter + body</text>
  </g>

  <text x="360" y="100" fill="#8b949e" font-size="12" text-anchor="middle">ENTRY PATH B · inline form</text>
  <g font-size="11" fill="#c9d1d9">
    <rect x="300" y="116" width="120" height="26" rx="4" fill="#21262d" stroke="#30363d"/>
    <text x="360" y="133" fill="#e6edf3" text-anchor="middle">CLI args</text>
    <text x="360" y="156" fill="#8b949e" text-anchor="middle">--project / --title / --narrative</text>
    <text x="360" y="172" fill="#8b949e" text-anchor="middle">--facts / --concepts / --files / --platform</text>
  </g>

  <!-- arrows into CLI -->
  <path d="M 120 142 L 200 250" stroke="#7ee787" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 360 142 L 460 250" stroke="#7ee787" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- column 2: CLI box -->
  <text x="580" y="100" fill="#8b949e" font-size="12" text-anchor="middle">CLI box</text>
  <rect x="470" y="116" width="220" height="220" rx="8" fill="#161b22" stroke="#3d4453" stroke-width="1"/>
  <text x="580" y="140" fill="#7ee787" font-size="13" font-weight="600" text-anchor="middle">claude-mem-for-all</text>
  <text x="580" y="158" fill="#8b949e" font-size="11" text-anchor="middle">tools/claude-mem-for-all.swift</text>

  <g font-size="10" fill="#c9d1d9">
    <rect x="486" y="172" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="186" fill="#e6edf3" text-anchor="middle">[file] parse frontmatter block</text>
  </g>
  <g font-size="10" fill="#c9d1d9">
    <rect x="486" y="198" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="212" fill="#e6edf3" text-anchor="middle">[inline] assemble record from args</text>
  </g>
  <g font-size="10" fill="#c9d1d9">
    <rect x="486" y="224" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="238" fill="#e6edf3" text-anchor="middle">derive session key → UUIDv5 content_hash</text>
  </g>

  <g font-size="10" fill="#c9d1d9">
    <rect x="486" y="250" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="264" fill="#e6edf3" text-anchor="middle">open SQLite: CLAUDE_MEM_DATA_DIR/claude-mem.db</text>
  </g>

  <g font-size="10" fill="#7ee787">
    <rect x="486" y="276" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="290" fill="#7ee787" text-anchor="middle" font-weight="600">dedup query (content_hash OR project+title)</text>
  </g>

  <g font-size="10" fill="#7ee787">
    <rect x="486" y="302" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="316" fill="#7ee787" text-anchor="middle" font-weight="600">already present → ALREADY PRESENT · exit 0</text>
  </g>

  <g font-size="10" fill="#c9d1d9">
    <rect x="486" y="328" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="342" fill="#c9d1d9" text-anchor="middle">not present → INSERT sdk_sessions + observations</text>
  </g>

  <g font-size="10" fill="#7ee787">
    <rect x="486" y="354" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="368" fill="#7ee787" text-anchor="middle" font-weight="600">INSERTED observations.id=N · exit 0</text>
  </g>

  <g font-size="10" fill="#c9d1d9">
    <rect x="486" y="380" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="394" fill="#c9d1d9" text-anchor="middle">INSERT INTO sdk_sessions (content_session_id, memory_session_id, project, platform_source, ...)</text>
    <rect x="486" y="406" width="188" height="22" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="580" y="420" fill="#c9d1d9" text-anchor="middle">INSERT INTO observations (memory_session_id, title, narrative, content_hash, ...)</text>
  </g>

  <text x="580" y="448" fill="#8b949e" font-size="10" text-anchor="middle">one-shot · idempotent · no runtime</text>

  <!-- arrows to DB -->
  <path d="M 580 410 L 700 470" stroke="#7ee787" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 580 430 L 700 500" stroke="#7ee787" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- column 3: DB -->
  <text x="780" y="100" fill="#8b949e" font-size="12" text-anchor="middle">SQLite store</text>
  <rect x="700" y="116" width="170" height="170" rx="8" fill="#161b22" stroke="#3d4453" stroke-width="1"/>
  <text x="785" y="140" fill="#7ee787" font-size="12" font-weight="600">claude-mem.db</text>
  <g font-size="10" fill="#c9d1d9">
    <rect x="716" y="156" width="138" height="14" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="785" y="164" fill="#e6edf3" text-anchor="middle">sdk_sessions</text>
    <rect x="716" y="174" width="138" height="40" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="785" y="188" fill="#c9d1d9" text-anchor="middle">content_session_id</text>
    <text x="785" y="200" fill="#c9d1d9" text-anchor="middle">memory_session_id ←→ observations</text>
    <text x="785" y="212" fill="#7ee787" text-anchor="middle" font-weight="600">platform_source</text>
  </g>
  <g font-size="10" fill="#c9d1d9">
    <rect x="716" y="220" width="138" height="14" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="785" y="228" fill="#e6edf3" text-anchor="middle">observations</text>
    <rect x="716" y="240" width="138" height="40" rx="3" fill="#21262d" stroke="#30363d"/>
    <text x="785" y="254" fill="#c9d1d9" text-anchor="middle">content_hash ← dedup key</text>
    <text x="785" y="266" fill="#c9d1d9" text-anchor="middle">narrative · concepts</text>
    <text x="785" y="278" fill="#c9d1d9" text-anchor="middle">files_modified (JSON)</text>
  </g>

  <!-- footnotes -->
  <g font-size="10" fill="#8b949e">
    <text x="40" y="498">file form: `---` block parsed for project · type · tags; title derived from filename; body ≤4000 chars → narrative</text>
    <text x="40" y="514">inline form: --project/--title/--narrative required; --subtitle/--concepts/--files/--platform optional; --platform default = pi</text>
    <text x="40" y="526">dedup: content_hash (UUIDv5(sessionKey+title)). same agent + same title = no-op. different agent + same title = two rows survive.</text>
  </g>
</svg>
